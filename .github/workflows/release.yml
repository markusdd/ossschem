name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      valid: ${{ steps.tag.outputs.valid }}
      number: ${{ steps.tag.outputs.number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - id: tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "valid=true" >> "$GITHUB_OUTPUT"
            echo "number=${TAG#v}" >> "$GITHUB_OUTPUT"
          else
            echo "valid=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Check release manifest versions
        if: steps.tag.outputs.valid == 'true'
        run: npm run version:check -- "${{ steps.tag.outputs.number }}"

  test:
    needs: version
    if: needs.version.outputs.valid == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test

  command:
    needs: [version, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux-x64
          - runner: ubuntu-24.04-arm
            platform: linux-arm64
          - runner: macos-15-intel
            platform: darwin-x64
          - runner: macos-15
            platform: darwin-arm64
          - runner: windows-2022
            platform: win-x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Package command and viewer
        run: npm run package:dist -- --version "${{ needs.version.outputs.number }}"
      - uses: actions/upload-artifact@v4
        with:
          name: command-${{ matrix.platform }}
          path: |
            dist/ossschem-${{ needs.version.outputs.number }}-${{ matrix.platform }}.tar.gz
            dist/ossschem-${{ needs.version.outputs.number }}-${{ matrix.platform }}.zip
          if-no-files-found: error

  extension:
    needs: [version, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Package VS Code extension
        run: npm run package:vsix -- "${{ needs.version.outputs.number }}"
      - uses: actions/upload-artifact@v4
        with:
          name: vscode-extension
          path: apps/vscode/ossschem-${{ needs.version.outputs.number }}.vsix
          if-no-files-found: error

  # Off until the marketplace publisher accounts are in place: turn it on with
  # the repository variable PUBLISH_EXTENSION set to "true" (Settings ->
  # Secrets and variables -> Actions -> Variables), and add whichever tokens
  # apply. Until then the .vsix rides on the GitHub release and is uploaded by
  # hand. Each step also skips itself when its token is missing, so one
  # marketplace can be published to without the other.
  marketplace:
    needs: [version, extension]
    if: ${{ vars.PUBLISH_EXTENSION == 'true' }}
    runs-on: ubuntu-latest
    # The environment is what makes this job's identity to Microsoft a fixed
    # name -- `repo:<owner>/<repo>:environment:marketplace` -- rather than one
    # per tag, which is what the trust rule over there is written against.
    environment: marketplace
    permissions:
      contents: read
      # lets the runner ask GitHub for the signed token Microsoft trusts
      id-token: write
    env:
      VSIX: release/ossschem-${{ needs.version.outputs.number }}.vsix
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      # set this and vsce signs in with it directly; leave it empty and the
      # federated login below is used instead
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: vscode-extension
          path: release
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Only for the no-secret route: GitHub signs a statement about this run,
      # Microsoft trusts it, and the Azure CLI holds the result. vsce asks the
      # CLI for it, which is one of the things --azure-credential tries. With
      # AZURE_CLIENT_SECRET set there is nothing to sign in for.
      - name: Sign in to Microsoft
        if: env.AZURE_CLIENT_ID != '' && env.AZURE_CLIENT_SECRET == ''
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          # the identity publishes an extension; it owns nothing in Azure
          allow-no-subscriptions: true
      # Publishes the same file the release carries, rather than building a
      # second one.
      - name: Publish to the VS Code Marketplace
        if: env.AZURE_CLIENT_ID != ''
        run: npx --yes @vscode/vsce publish --azure-credential --packagePath "$VSIX"
      # VSCodium, Cursor, Windsurf and Theia install from Open VSX, not from
      # the Microsoft marketplace
      - name: Publish to Open VSX
        if: env.OVSX_PAT != ''
        run: npx --yes ovsx publish "$VSIX" -p "$OVSX_PAT"

  publish:
    needs: [version, command, extension]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: command-*
          path: release
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: vscode-extension
          path: release
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" release/* --verify-tag --generate-notes
