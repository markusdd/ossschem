name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      valid: ${{ steps.tag.outputs.valid }}
      number: ${{ steps.tag.outputs.number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - id: tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "valid=true" >> "$GITHUB_OUTPUT"
            echo "number=${TAG#v}" >> "$GITHUB_OUTPUT"
          else
            echo "valid=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Check release manifest versions
        if: steps.tag.outputs.valid == 'true'
        run: npm run version:check -- "${{ steps.tag.outputs.number }}"

  test:
    needs: version
    if: needs.version.outputs.valid == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test

  command:
    needs: [version, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux-x64
          - runner: ubuntu-24.04-arm
            platform: linux-arm64
          - runner: macos-15-intel
            platform: darwin-x64
          - runner: macos-15
            platform: darwin-arm64
          - runner: windows-2022
            platform: win-x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Package command and viewer
        run: npm run package:dist -- --version "${{ needs.version.outputs.number }}"
      - uses: actions/upload-artifact@v4
        with:
          name: command-${{ matrix.platform }}
          path: |
            dist/ossschem-${{ needs.version.outputs.number }}-${{ matrix.platform }}.tar.gz
            dist/ossschem-${{ needs.version.outputs.number }}-${{ matrix.platform }}.zip
          if-no-files-found: error

  extension:
    needs: [version, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Package VS Code extension
        run: npm run package:vsix -- "${{ needs.version.outputs.number }}"
      - uses: actions/upload-artifact@v4
        with:
          name: vscode-extension
          path: apps/vscode/ossschem-${{ needs.version.outputs.number }}.vsix
          if-no-files-found: error

  # Off until the marketplace publisher accounts are in place: turn it on with
  # the repository variable PUBLISH_EXTENSION set to "true" (Settings ->
  # Secrets and variables -> Actions -> Variables), and add whichever tokens
  # apply. Until then the .vsix rides on the GitHub release and is uploaded by
  # hand. Each step also skips itself when its token is missing, so one
  # marketplace can be published to without the other.
  marketplace:
    needs: [version, extension]
    if: ${{ vars.PUBLISH_EXTENSION == 'true' }}
    runs-on: ubuntu-latest
    env:
      VSIX: release/ossschem-${{ needs.version.outputs.number }}.vsix
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: vscode-extension
          path: release
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Publishes the same file the release carries, rather than building a
      # second one. With Entra ID instead of a token, drop VSCE_PAT and use
      # `--azure-credential` after an azure/login step.
      - name: Publish to the VS Code Marketplace
        if: env.VSCE_PAT != ''
        run: npx --yes @vscode/vsce publish --packagePath "$VSIX"
      # VSCodium, Cursor, Windsurf and Theia install from Open VSX, not from
      # the Microsoft marketplace
      - name: Publish to Open VSX
        if: env.OVSX_PAT != ''
        run: npx --yes ovsx publish "$VSIX" -p "$OVSX_PAT"

  publish:
    needs: [version, command, extension]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: command-*
          path: release
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: vscode-extension
          path: release
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" release/* --verify-tag --generate-notes
